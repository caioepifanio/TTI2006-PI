<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AACD - Tela Inicial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="tela-inicial">
        <section class="card-login" aria-labelledby="titulo-login">
            <h1 id="titulo-login" class="card-login__titulo">Selecione o tipo de Login</h1>

            <div class="card-login__opcoes">
                <a href="/LOGIN_FUNCIONARIOS/login_funcionarios.html" class="botao-login">
                    <img src="img/logo-aacd.png" alt="Logo AACD" class="botao-login__icone botao-login__icone--logo">
                    <span class="botao-login__texto">Funcionario AACD</span>
                </a>

                <a href="/LOGIN_VOLUNTARIOS/login_voluntarios.html" class="botao-login">
                    <img src="img/voluntarios.png" alt="" class="botao-login__icone">
                    <span class="botao-login__texto">Voluntário</span>
                </a>
            </div>

            <a href="https://aacd.org.br/" class="card-login__link">Conhecer a AACD</a>

            <div class="card-login__marca">
                <span class="card-login__marca-texto"></span>
                <img src="img/logoaacd2.png"alt="AACD" class="card-login__marca-logo">
            </div>
        </section>
    </main>
    <script src="tela-inicial.js"></script>
</body>
</html>
